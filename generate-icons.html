<!DOCTYPE html>
<html>

<head>
    <title>PromptLayer Icon Generator</title>
</head>

<body style="background:#111;color:#fff;font-family:sans-serif;padding:40px;">
    <h2>PromptLayer Icon Generator</h2>
    <p>Right-click each icon below → "Save image as..." → save to <code>icons/</code> folder</p>
    <div style="display:flex;gap:30px;margin-top:30px;align-items:end;">
        <div>
            <canvas id="c16" width="16" height="16"></canvas>
            <p>icon16.png</p>
        </div>
        <div>
            <canvas id="c48" width="48" height="48"></canvas>
            <p>icon48.png</p>
        </div>
        <div>
            <canvas id="c128" width="128" height="128"></canvas>
            <p>icon128.png</p>
        </div>
    </div>
    <script>
        function drawIcon(canvasId, size) {
            const c = document.getElementById(canvasId);
            const ctx = c.getContext('2d');
            const r = size * 0.22; // corner radius

            // Rounded rect background with gradient
            const grad = ctx.createLinearGradient(0, 0, size, size);
            grad.addColorStop(0, '#6366f1');
            grad.addColorStop(1, '#8b5cf6');

            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(size - r, 0);
            ctx.quadraticCurveTo(size, 0, size, r);
            ctx.lineTo(size, size - r);
            ctx.quadraticCurveTo(size, size, size - r, size);
            ctx.lineTo(r, size);
            ctx.quadraticCurveTo(0, size, 0, size - r);
            ctx.lineTo(0, r);
            ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();

            // Lightning bolt
            const s = size / 24; // scale factor (icon designed on 24x24 grid)
            ctx.beginPath();
            ctx.moveTo(13 * s, 2 * s);
            ctx.lineTo(3 * s, 14 * s);
            ctx.lineTo(12 * s, 14 * s);
            ctx.lineTo(11 * s, 22 * s);
            ctx.lineTo(21 * s, 10 * s);
            ctx.lineTo(12 * s, 10 * s);
            ctx.closePath();
            ctx.fillStyle = 'white';
            ctx.fill();
        }

        drawIcon('c16', 16);
        drawIcon('c48', 48);
        drawIcon('c128', 128);
    </script>
</body>

</html>
