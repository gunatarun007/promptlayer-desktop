<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src *;">
    <title>PromptLayer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="pl-card" id="pl-card">

        <!-- Header -->
        <div class="pl-header" id="pl-header">
            <div class="pl-logo">
                <svg class="pl-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 2 10 6.5-10 6.5L2 8.5Z" />
                    <path d="m2 15.5 10 6.5 10-6.5" />
                    <path d="m2 12 10 6.5 10-6.5" />
                </svg>
                <span class="pl-logo-text">PromptLayer</span>
            </div>
            <div class="pl-header-actions">
                <button class="pl-icon-btn" id="btn-settings" title="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
                <button class="pl-icon-btn" id="btn-minimize" title="Minimize">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M5 12h14" />
                    </svg>
                </button>
                <button class="pl-icon-btn" id="btn-close" title="Close (Esc)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Main View -->
        <div class="pl-view pl-main-view active" id="view-main">
            <div class="pl-input-wrap">
                <textarea class="pl-textarea" id="pl-input" placeholder="Paste or type your prompt…" spellcheck="false"
                    autofocus></textarea>
                <span class="pl-char-count" id="pl-charcount">0</span>
            </div>

            <div class="pl-mode-selector">
                <div class="pl-mode-label">Prompt Mode</div>
                <div class="pl-mode-grid" id="pl-mode-grid">
                    <button class="pl-mode-btn active" data-mode="quick_fix">Quick Fix</button>
                    <button class="pl-mode-btn" data-mode="deep_reasoning">Deep Reasoning</button>
                    <button class="pl-mode-btn" data-mode="structured">Structured Output</button>
                    <button class="pl-mode-btn" data-mode="creative">Creative Boost</button>
                    <button class="pl-mode-btn" data-mode="developer">Developer Precision</button>
                </div>
                <div class="pl-oneshot">
                    <label class="pl-checkbox-label">
                        <input type="checkbox" id="pl-oneshot-toggle">
                        <span class="pl-checkbox-box"></span>
                        One-Shot Mode (Minimal Optimization)
                    </label>
                </div>
            </div>

            <button class="pl-btn pl-btn-primary" id="btn-enhance" disabled>
                <svg class="pl-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" />
                </svg>
                <span id="btn-enhance-text">Enhance</span>
            </button>

            <div class="pl-result-area" id="pl-result-area">
                <div class="pl-result-header">
                    <span class="pl-result-label">Enhanced</span>
                    <button class="pl-text-btn" id="btn-improve">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                            <path d="M21 3v5h-5" />
                            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
                            <path d="M8 16H3v5" />
                        </svg>
                        Improve again
                    </button>
                </div>
                <div class="pl-result-body" id="pl-result-body"></div>
                <div class="pl-result-actions">
                    <button class="pl-btn pl-btn-accent" id="btn-insert">
                        <svg class="pl-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14" />
                            <path d="m19 12-7 7-7-7" />
                        </svg>
                        Insert
                    </button>
                    <button class="pl-btn pl-btn-secondary" id="btn-copy">
                        <svg class="pl-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                        </svg>
                        Copy
                    </button>
                </div>
            </div>
        </div>

        <!-- Settings View -->
        <div class="pl-view pl-settings-view" id="view-settings">
            <!-- Welcome header (first-run only) -->
            <div class="pl-welcome" id="pl-welcome" style="display: none;">
                <div class="pl-welcome-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="m12 2 10 6.5-10 6.5L2 8.5Z" />
                        <path d="m2 15.5 10 6.5 10-6.5" />
                        <path d="m2 12 10 6.5 10-6.5" />
                    </svg>
                </div>
                <h2 class="pl-welcome-title">Welcome to PromptLayer</h2>
                <p class="pl-welcome-subtitle">Let's get you set up in 30 seconds.</p>
            </div>

            <!-- Normal settings header (returning users) -->
            <div class="pl-settings-header" id="pl-settings-header">
                <button class="pl-icon-btn" id="btn-back" title="Back">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="m15 18-6-6 6-6" />
                    </svg>
                </button>
                <span class="pl-settings-title">Settings</span>
            </div>

            <div class="pl-field">
                <label class="pl-label">Provider</label>
                <select class="pl-select" id="set-provider">
                    <option value="openai">OpenAI</option>
                    <option value="gemini">Google Gemini</option>
                    <option value="groq">Groq</option>
                    <option value="openrouter">OpenRouter</option>
                    <option value="custom">Custom</option>
                </select>
            </div>
            <div class="pl-field">
                <label class="pl-label">API Key</label>
                <input type="password" class="pl-input-field" id="set-apikey" placeholder="sk-..." autocomplete="off"
                    spellcheck="false">
                <span class="pl-field-error" id="pl-apikey-error"></span>
            </div>
            <div class="pl-field">
                <label class="pl-label">Model</label>
                <input type="text" class="pl-input-field" id="set-model" placeholder="gpt-4o-mini" spellcheck="false">
            </div>
            <div class="pl-field">
                <label class="pl-label">API Base URL</label>
                <input type="text" class="pl-input-field" id="set-apibase" placeholder="https://api.openai.com/v1"
                    spellcheck="false">
            </div>

            <div class="pl-field" style="margin-top: 4px; padding-top: 8px;">
                <label class="pl-checkbox-label">
                    <input type="checkbox" id="set-autostart">
                    <span class="pl-checkbox-box"></span>
                    Launch PromptLayer at Startup
                </label>
            </div>

            <button class="pl-btn pl-btn-primary pl-btn-full" id="btn-save">
                <svg class="pl-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                </svg>
                Save Settings
            </button>
        </div>

        <!-- Footer -->
        <div class="pl-footer">
            <div class="pl-status">
                <span class="pl-status-dot" id="pl-status-dot"></span>
                <span class="pl-status-text" id="pl-status-text">Ready</span>
            </div>
            <span class="pl-shortcut-hint" id="pl-shortcut-hint">Ctrl+Shift+L</span>
        </div>
    </div>

    <!-- Shortcut tooltip (shown after first save) -->
    <div class="pl-tooltip" id="pl-tooltip" style="display: none;">
        <span class="pl-tooltip-text" id="pl-tooltip-text">Press <strong>Ctrl+Shift+L</strong> anytime to enhance
            prompts.</span>
        <button class="pl-tooltip-close" id="pl-tooltip-close">✕</button>
    </div>

    <script src="app.js"></script>
</body>

</html>
